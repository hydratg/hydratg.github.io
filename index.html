
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HYDRA BLACK · пиццерия</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --purple-1: #c084fc;
      --purple-2: #a855f7;
      --purple-3: #7c3aed;
      --purple-4: #4c1d95;
      --bg: #060608;
      --card-bg: rgba(20, 20, 26, 0.7);
      --border: rgba(168, 85, 247, 0.15);
      --text-dim: #8b8b9a;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background-color: var(--bg);
      color: #ffffff;
      line-height: 1.45;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Декоративные светящиеся пятна на фоне */
    body::before,
    body::after {
      content: "";
      position: fixed;
      border-radius: 50%;
      filter: blur(140px);
      opacity: 0.35;
      z-index: 0;
      pointer-events: none;
    }

    body::before {
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, #7c3aed 0%, transparent 70%);
      top: -200px;
      left: -200px;
    }

    body::after {
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, #a855f7 0%, transparent 70%);
      bottom: -150px;
      right: -150px;
    }

    .container { max-width: 1280px; margin: 0 auto; padding: 0 20px; position: relative; z-index: 1; }

    /* ---------- ШАПКА ---------- */
    header {
      padding: 16px 0;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(20px);
      background-color: rgba(6, 6, 8, 0.75);
      border-bottom: 1px solid var(--border);
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
    }

    .logo {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: -0.5px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 6px;
      user-select: none;
    }

    .logo .hydra {
      background: linear-gradient(135deg, var(--purple-1), var(--purple-3), var(--purple-4));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 20px rgba(168, 85, 247, 0.5));
    }

    .logo .black { color: #ffffff; font-weight: 300; letter-spacing: 3px; }

    .city-selector {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(20, 20, 26, 0.7);
      padding: 8px 18px;
      border-radius: 40px;
      border: 1px solid var(--border);
      font-size: 15px;
      font-weight: 500;
      color: #ddd;
      backdrop-filter: blur(10px);
    }

    nav { display: flex; gap: 26px; font-weight: 500; font-size: 16px; }

    nav a {
      color: #b0b0b0;
      text-decoration: none;
      transition: color 0.2s;
      position: relative;
      padding-bottom: 4px;
    }

    nav a::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--purple-1), var(--purple-3));
      transition: width 0.25s ease, left 0.25s ease;
      border-radius: 2px;
    }

    nav a:hover { color: #fff; }
    nav a:hover::after { width: 100%; left: 0; }

    .cart-btn {
      background: linear-gradient(145deg, var(--purple-1), var(--purple-3));
      color: #070707;
      font-weight: 800;
      padding: 11px 22px;
      border-radius: 40px;
      font-size: 15px;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      letter-spacing: 0.3px;
      box-shadow: 0 6px 24px rgba(124, 58, 237, 0.45), 0 0 0 1px rgba(192, 132, 252, 0.3) inset;
      transition: filter 0.15s, transform 0.15s, box-shadow 0.2s;
      font-family: inherit;
    }

    .cart-btn:hover {
      filter: brightness(1.12);
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(124, 58, 237, 0.6), 0 0 0 1px rgba(192, 132, 252, 0.5) inset;
    }

    .cart-btn.bump { animation: bump 0.35s ease; }

    @keyframes bump {
      0% { transform: scale(1); }
      40% { transform: scale(1.12); }
      100% { transform: scale(1); }
    }

    /* ---------- HERO ---------- */
    .hero { padding: 60px 0 30px; position: relative; }

    .hero-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(168, 85, 247, 0.1);
      border: 1px solid rgba(168, 85, 247, 0.35);
      color: var(--purple-1);
      padding: 6px 16px;
      border-radius: 40px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 22px;
    }

    .hero h1 {
      font-size: 64px;
      font-weight: 900;
      line-height: 1.02;
      letter-spacing: -2.5px;
      color: #ffffff;
      max-width: 820px;
      margin-bottom: 20px;
    }

    .hero h1 em {
      font-style: normal;
      background: linear-gradient(135deg, var(--purple-1), var(--purple-2), var(--purple-3));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 30px rgba(168, 85, 247, 0.4));
    }

    .hero p {
      color: var(--text-dim);
      font-size: 19px;
      max-width: 620px;
      margin-bottom: 30px;
    }

    .hero-stats {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
    }

    .stat-pill {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(20, 20, 26, 0.6);
      border: 1px solid var(--border);
      border-radius: 40px;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 500;
      color: #ccc;
      backdrop-filter: blur(10px);
    }

    .stat-pill i { font-style: normal; font-size: 18px; }

    /* ---------- СЕКЦИИ ---------- */
    .menu-section { padding: 40px 0 55px; scroll-margin-top: 90px; }

    .section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 34px;
    }

    .section-title {
      font-size: 40px;
      font-weight: 900;
      letter-spacing: -1.5px;
      color: #ffffff;
    }

    .section-title span {
      background: linear-gradient(135deg, var(--purple-1), var(--purple-2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-left: 10px;
    }

    .section-sub {
      color: var(--text-dim);
      font-size: 15px;
    }

    /* ---------- СЕТКА КАРТОЧЕК ---------- */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 28px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 30px;
      padding: 26px 24px 24px;
      border: 1px solid var(--border);
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 50px -18px rgba(0, 0, 0, 0.9);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s, border-color 0.3s;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      top: -60%;
      left: -30%;
      width: 160%;
      height: 160%;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.12) 0%, transparent 60%);
      opacity: 0;
      transition: opacity 0.4s;
      pointer-events: none;
    }

    .card:hover {
      transform: translateY(-8px);
      border-color: rgba(168, 85, 247, 0.45);
      box-shadow: 0 30px 60px -20px rgba(124, 58, 237, 0.5), 0 0 0 1px rgba(168, 85, 247, 0.2) inset;
    }

    .card:hover::before { opacity: 1; }

    .card-visual {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 24px;
      margin-bottom: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 100px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 12px 30px -10px black, 0 0 0 1px rgba(168, 85, 247, 0.15) inset;
    }

    .card-visual::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 30% 25%, rgba(255, 255, 255, 0.15) 0%, transparent 45%);
      pointer-events: none;
    }

    .card[data-type="pizza-pepperoni"] .card-visual { background: radial-gradient(circle at 40% 35%, #8b3a1f, #2b0f07 75%); }
    .card[data-type="pizza-margherita"] .card-visual { background: radial-gradient(circle at 40% 35%, #5a7d45, #1b2a10 75%); }
    .card[data-type="drink-cola"] .card-visual { background: radial-gradient(circle at 40% 35%, #4a0d0d, #1a0404 75%); }
    .card[data-type="drink-orange"] .card-visual { background: radial-gradient(circle at 40% 35%, #9a5e0f, #3b1e04 75%); }

    .card[data-type="pizza-pepperoni"] .card-visual::before,
    .card[data-type="pizza-margherita"] .card-visual::before { content: "🍕"; filter: drop-shadow(0 10px 18px rgba(0,0,0,0.7)); }
    .card[data-type="drink-cola"] .card-visual::before { content: "🥤"; filter: drop-shadow(0 10px 18px rgba(0,0,0,0.7)); }
    .card[data-type="drink-orange"] .card-visual::before { content: "🧃"; filter: drop-shadow(0 10px 18px rgba(0,0,0,0.7)); }

    .card h3 {
      font-size: 26px;
      font-weight: 800;
      margin-bottom: 10px;
      letter-spacing: -0.4px;
      color: #ffffff;
    }

    .card-desc {
      color: var(--text-dim);
      font-size: 15px;
      margin-bottom: 22px;
      line-height: 1.55;
      flex-grow: 1;
    }

    .price-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .price {
      font-size: 34px;
      font-weight: 900;
      background: linear-gradient(135deg, var(--purple-1), var(--purple-2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -1.5px;
    }

    .price small {
      font-size: 16px;
      font-weight: 500;
      color: #777;
      margin-left: 4px;
      -webkit-text-fill-color: #777;
    }

    .weight {
      color: #888;
      font-size: 13px;
      background: rgba(255, 255, 255, 0.04);
      padding: 6px 14px;
      border-radius: 40px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      font-weight: 500;
    }

    .card-actions { display: flex; gap: 10px; margin-top: 4px; position: relative; z-index: 2; }

    .btn-primary {
      background: linear-gradient(145deg, var(--purple-1), var(--purple-3));
      border: none;
      color: #070707;
      font-weight: 800;
      padding: 15px 18px;
      border-radius: 40px;
      font-size: 15px;
      cursor: pointer;
      flex: 1;
      text-align: center;
      transition: filter 0.15s, transform 0.1s, box-shadow 0.2s;
      box-shadow: 0 8px 20px rgba(124, 58, 237, 0.3);
      letter-spacing: 0.3px;
      font-family: inherit;
    }

    .btn-primary:hover {
      filter: brightness(1.15);
      box-shadow: 0 12px 28px rgba(124, 58, 237, 0.5);
    }

    .btn-primary:active { transform: scale(0.96); }

    .btn-outline {
      background: transparent;
      border: 1.5px solid rgba(255, 255, 255, 0.12);
      color: #ccc;
      font-weight: 600;
      padding: 15px 18px;
      border-radius: 40px;
      font-size: 15px;
      cursor: default;
      flex: 1;
      text-align: center;
      font-family: inherit;
      transition: background 0.15s, border-color 0.15s;
    }

    .btn-outline:hover { background: rgba(255, 255, 255, 0.05); border-color: rgba(255,255,255,0.25); }

    /* ---------- О НАС ---------- */
    .about-section { padding: 55px 0 40px; scroll-margin-top: 90px; }

    .about-card {
      background: var(--card-bg);
      border-radius: 36px;
      padding: 52px 48px;
      border: 1px solid var(--border);
      backdrop-filter: blur(20px);
      box-shadow: 0 30px 60px -25px rgba(124, 58, 237, 0.4);
      display: flex;
      flex-wrap: wrap;
      gap: 44px;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    .about-card::before {
      content: "";
      position: absolute;
      top: -50%;
      right: -20%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.15) 0%, transparent 70%);
      pointer-events: none;
    }

    .about-text { flex: 2 1 380px; position: relative; }

    .about-text h2 {
      font-size: 44px;
      font-weight: 900;
      letter-spacing: -1.5px;
      margin-bottom: 20px;
      color: #ffffff;
      line-height: 1.1;
    }

    .about-text h2 em {
      font-style: normal;
      background: linear-gradient(135deg, var(--purple-1), var(--purple-2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .about-text p {
      color: #a5a5b5;
      font-size: 17px;
      line-height: 1.7;
      margin-bottom: 16px;
      max-width: 620px;
    }

    .about-features {
      flex: 1 1 240px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: relative;
    }

    .feature {
      display: flex;
      align-items: center;
      gap: 14px;
      background: rgba(255, 255, 255, 0.03);
      padding: 18px 22px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      transition: border-color 0.2s, background 0.2s;
    }

    .feature:hover {
      border-color: rgba(168, 85, 247, 0.35);
      background: rgba(168, 85, 247, 0.06);
    }

    .feature-icon { font-size: 28px; }
    .feature span { font-weight: 600; font-size: 15px; color: #ddd; }

    /* ---------- ИНФО-ПАНЕЛЬ ---------- */
    .info-bar {
      background: var(--card-bg);
      border-radius: 28px;
      padding: 30px 36px;
      margin: 45px 0 30px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      border: 1px solid var(--border);
      backdrop-filter: blur(20px);
    }

    .info-item { display: flex; align-items: center; gap: 16px; }
    .info-icon { font-size: 32px; filter: drop-shadow(0 4px 10px rgba(168, 85, 247, 0.4)); }
    .info-text h4 { font-size: 17px; font-weight: 700; color: #fff; margin-bottom: 4px; }
    .info-text p { color: var(--text-dim); font-size: 14px; }

    /* ---------- ФУТЕР ---------- */
    footer {
      padding: 40px 0 50px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      color: #5a5a6a;
      font-size: 14px;
      margin-top: 30px;
      position: relative;
      z-index: 1;
    }

    .footer-inner {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .footer-links { display: flex; gap: 28px; flex-wrap: wrap; }
    .footer-links a { color: #7a7a8a; text-decoration: none; transition: color 0.2s; }
    .footer-links a:hover { color: var(--purple-1); }

    /* ========== КОРЗИНА ========== */
    .cart-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      z-index: 200;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s, visibility 0.3s;
    }

    .cart-overlay.open { opacity: 1; visibility: visible; }

    .cart-panel {
      position: fixed;
      top: 0;
      right: 0;
      height: 100%;
      width: 100%;
      max-width: 470px;
      background: #0a0a0f;
      border-left: 1px solid var(--border);
      z-index: 210;
      transform: translateX(100%);
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      box-shadow: -30px 0 80px rgba(124, 58, 237, 0.15);
    }

    .cart-panel.open { transform: translateX(0); }

    .cart-header {
      padding: 26px 28px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .cart-header h2 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .cart-header h2 span {
      background: linear-gradient(135deg, var(--purple-1), var(--purple-2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .cart-count {
      background: rgba(168, 85, 247, 0.15);
      border: 1px solid rgba(168, 85, 247, 0.35);
      color: var(--purple-1);
      font-size: 13px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 20px;
    }

    .cart-close {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      font-size: 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, border-color 0.2s, transform 0.2s;
      line-height: 1;
      font-family: inherit;
    }

    .cart-close:hover {
      background: rgba(239, 68, 68, 0.15);
      border-color: rgba(239, 68, 68, 0.4);
      color: #ef4444;
      transform: rotate(90deg);
    }

    .cart-body { flex: 1; overflow-y: auto; padding: 12px 24px; }

    .cart-empty { text-align: center; padding: 80px 20px; color: #666; }
    .cart-empty-icon { font-size: 72px; margin-bottom: 22px; opacity: 0.5; }
    .cart-empty p { font-size: 18px; color: #888; margin-bottom: 8px; font-weight: 600; }
    .cart-empty small { color: #555; font-size: 14px; }

    .cart-item {
      display: flex;
      gap: 14px;
      padding: 20px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      animation: fadeIn 0.35s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .cart-item-visual {
      width: 74px;
      height: 74px;
      border-radius: 20px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      box-shadow: 0 0 0 1px rgba(168, 85, 247, 0.2) inset, 0 8px 16px -6px black;
    }

    .cart-item[data-type="pizza-pepperoni"] .cart-item-visual { background: radial-gradient(circle at 40% 35%, #8b3a1f, #2b0f07 75%); }
    .cart-item[data-type="pizza-margherita"] .cart-item-visual { background: radial-gradient(circle at 40% 35%, #5a7d45, #1b2a10 75%); }
    .cart-item[data-type="drink-cola"] .cart-item-visual { background: radial-gradient(circle at 40% 35%, #4a0d0d, #1a0404 75%); }
    .cart-item[data-type="drink-orange"] .cart-item-visual { background: radial-gradient(circle at 40% 35%, #9a5e0f, #3b1e04 75%); }

    .cart-item[data-type="pizza-pepperoni"] .cart-item-visual::before,
    .cart-item[data-type="pizza-margherita"] .cart-item-visual::before { content: "🍕"; }
    .cart-item[data-type="drink-cola"] .cart-item-visual::before { content: "🥤"; }
    .cart-item[data-type="drink-orange"] .cart-item-visual::before { content: "🧃"; }

    .cart-item-main { flex: 1; min-width: 0; }

    .cart-item-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 6px;
    }

    .cart-item-info h4 { font-size: 16px; font-weight: 700; color: #fff; margin-bottom: 3px; }
    .cart-item-info .cart-item-price { font-size: 13px; color: #888; }

    .remove-btn {
      background: transparent;
      border: none;
      color: #555;
      font-size: 20px;
      cursor: pointer;
      padding: 0 4px;
      transition: color 0.15s, transform 0.15s;
      line-height: 1;
      flex-shrink: 0;
      font-family: inherit;
    }

    .remove-btn:hover { color: #ef4444; transform: scale(1.2); }

    .cart-item-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
      gap: 10px;
    }

    .qty-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 40px;
      padding: 4px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .qty-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
      line-height: 1;
      font-family: inherit;
    }

    .qty-btn:hover { background: rgba(168, 85, 247, 0.2); border-color: rgba(168, 85, 247, 0.4); }
    .qty-btn:active { transform: scale(0.9); }

    .qty-value { font-size: 16px; font-weight: 700; color: #fff; min-width: 24px; text-align: center; }

    .cart-item-total {
      font-size: 17px;
      font-weight: 800;
      background: linear-gradient(135deg, var(--purple-1), var(--purple-2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      white-space: nowrap;
    }

    .cart-footer {
      padding: 24px 28px 28px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      flex-shrink: 0;
      background: #08080c;
    }

    .cart-total-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 20px;
    }

    .cart-total-row span:first-child { font-size: 16px; color: #999; }

    .cart-total-row .cart-total-value {
      font-size: 36px;
      font-weight: 900;
      background: linear-gradient(135deg, var(--purple-1), var(--purple-2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -1.5px;
    }

    .checkout-btn {
      width: 100%;
      padding: 18px;
      border-radius: 50px;
      border: none;
      background: linear-gradient(145deg, var(--purple-1), var(--purple-3));
      color: #070707;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      transition: filter 0.15s, transform 0.1s, box-shadow 0.2s;
      box-shadow: 0 12px 30px rgba(124, 58, 237, 0.4);
      letter-spacing: 0.3px;
      font-family: inherit;
    }

    .checkout-btn:hover:not(:disabled) {
      filter: brightness(1.15);
      box-shadow: 0 16px 40px rgba(124, 58, 237, 0.6);
    }

    .checkout-btn:active:not(:disabled) { transform: scale(0.98); }
    .checkout-btn:disabled { opacity: 0.35; cursor: not-allowed; box-shadow: none; }

    .clear-cart-btn {
      width: 100%;
      padding: 12px;
      border-radius: 50px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: transparent;
      color: #888;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
      font-family: inherit;
    }

    .clear-cart-btn:hover {
      background: rgba(239, 68, 68, 0.1);
      color: #ef4444;
      border-color: rgba(239, 68, 68, 0.35);
    }

    /* ========== TOAST ========== */
    .toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(140px);
      background: linear-gradient(145deg, var(--purple-1), var(--purple-3));
      color: #070707;
      padding: 15px 32px;
      border-radius: 50px;
      font-weight: 800;
      font-size: 15px;
      z-index: 300;
      opacity: 0;
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s;
      box-shadow: 0 15px 40px rgba(124, 58, 237, 0.6);
      pointer-events: none;
      white-space: nowrap;
      max-width: 90vw;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

      .section-title { font-size: 32px; }
    }
